name: Release Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:server
      - run: npm run test:updates
      - run: npm run desktop:package
      - name: Publish complete update files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = 'v' + $releaseVersion
          $installer = 'release/Forma-Studio-Setup-' + $releaseVersion + '.exe'
          gh release create $releaseTag $installer ($installer + '.blockmap') release/latest.yml release/update-policy.json release/SHA256SUMS.txt --draft --target $env:GITHUB_SHA --title ('Forma Studio ' + $releaseVersion) --notes-file updates/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $releaseTag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
