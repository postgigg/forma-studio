name: Security and contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: forma-license-test-only
          POSTGRES_DB: forma_license_test
        ports: ['55435:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forma_license_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: payments
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: payments/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm audit --omit=dev --audit-level=high
      - run: mkdir -p .local
      - run: npm run test:server
      - run: npm run test:updates
      - run: node scripts/verify-marketing-site.mjs
      - run: npm run build
