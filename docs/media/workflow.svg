<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="380" viewBox="0 0 1440 380" role="img" aria-labelledby="title desc">
<title id="title">The Forma workflow</title><desc id="desc">Start from a template, compose with editable layers, refine your design, then share an image or animation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3edff"/><stop offset="1" stop-color="#f9f2e5"/></linearGradient></defs><rect width="1440" height="380" rx="32" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" fill="#30263e"><text x="54" y="64" font-size="14" letter-spacing="3" fill="#796291">FROM A LITTLE IDEA TO SOMETHING YOURS</text>
<g transform="translate(52 102)"><rect width="308" height="224" rx="22" fill="white"/><rect x="24" y="24" width="62" height="74" rx="9" fill="#f4d6c4"/><path d="M35 85V58A20 20 0 0 1 75 58V85" fill="#cd967d"/><circle cx="55" cy="56" r="9" fill="#f8e4b9"/><text x="108" y="54" font-size="12" fill="#8c6aa9">01 / START</text><text x="108" y="81" font-size="22" font-weight="700">Find your spark</text><text x="24" y="145" font-size="16">A blank page or an occasion.</text><text x="24" y="175" font-size="16" fill="#766780">112 editable templates.</text></g>
<g transform="translate(394 102)"><rect width="308" height="224" rx="22" fill="white"/><rect x="26" y="28" width="57" height="57" rx="8" fill="#d8e4d0"/><circle cx="66" cy="64" r="27" fill="#9ab098"/><path d="M31 26H84V86H31Z" fill="none" stroke="#754adb" stroke-dasharray="4 4"/><text x="108" y="54" font-size="12" fill="#8c6aa9">02 / COMPOSE</text><text x="108" y="81" font-size="22" font-weight="700">Make it yours</text><text x="24" y="145" font-size="16">Photos, letters, charts, artwork.</text><text x="24" y="175" font-size="16" fill="#766780">Drag. Arrange. Group. Crop.</text></g>
<g transform="translate(736 102)"><rect width="308" height="224" rx="22" fill="white"/><path d="M53 25L62 49L86 58L62 67L53 91L44 67L20 58L44 49Z" fill="#b6a2df"/><path d="M81 23L85 34L96 38L85 42L81 53L77 42L66 38L77 34Z" fill="#e9c879"/><text x="108" y="54" font-size="12" fill="#8c6aa9">03 / REFINE</text><text x="108" y="81" font-size="22" font-weight="700">A little polish</text><text x="24" y="145" font-size="16">Edit by hand or brief the AI.</text><text x="24" y="175" font-size="16" fill="#766780">Review. Apply. Undo anytime.</text></g>
<g transform="translate(1078 102)"><rect width="308" height="224" rx="22" fill="white"/><rect x="24" y="30" width="62" height="50" rx="9" fill="#dbe0f5"/><path d="M49 42L49 68L68 55Z" fill="#754adb"/><text x="108" y="54" font-size="12" fill="#8c6aa9">04 / SHARE</text><text x="108" y="81" font-size="22" font-weight="700">Send it out</text><text x="24" y="145" font-size="16">Images, PDFs, GIFs and video.</text><text x="24" y="175" font-size="16" fill="#766780">Keep an editable JSON backup.</text></g></g></svg>
