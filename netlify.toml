[build]
  base = "website"
  command = "node ../scripts/verify-marketing-site.mjs"
  publish = "."
[build.environment]
  NODE_VERSION = "22"
[[redirects]]
  from = "/app/*"
  to = "/#download"
  status = 302
[[redirects]]
  from = "/editor/*"
  to = "/#download"
  status = 302
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
