<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" fill="none" role="img" aria-labelledby="title desc">
 <title id="title">From a brand's purpose to a considered design</title>
 <desc id="desc">An example floral brand brief informs audience, message, visual hierarchy, and color, leading to a carefully composed flower poster. This is an illustrative creative process.</desc>
 <defs>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#292432" flood-opacity=".09"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#754adb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>.ui{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.flow{stroke-dasharray:3 8;animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
 </defs>
 <circle cx="181" cy="340" r="170" fill="#eee7f6"/><circle cx="916" cy="369" r="185" fill="#e3e6d5"/>
 <text x="61" y="83" class="ui" font-size="12" font-weight="700" letter-spacing="2.2" fill="#754adb">A BRIEF WITH DIRECTION</text>
 <g transform="rotate(-4 207 355)" filter="url(#shadow)">
  <rect x="53" y="147" width="309" height="418" rx="3" fill="#fffdf9" stroke="#e5dce8"/>
  <path d="M81 193H332" stroke="#d7ccd9"/><text x="81" y="179" class="ui" font-size="11" font-weight="700" letter-spacing="1.8" fill="#92859e">BRAND NOTES / 01</text>
  <text x="81" y="243" class="serif" font-size="37" fill="#292432">Petal Studio</text><text x="81" y="283" class="ui" font-size="10" letter-spacing="1.5" fill="#754adb">OUR PURPOSE</text>
  <text x="81" y="316" class="serif" font-size="23" fill="#292432">Make everyday gifting</text><text x="81" y="345" class="serif" font-size="23" fill="#292432">feel personal.</text>
  <path d="M81 370H332" stroke="#e5dce8"/><text x="81" y="398" class="ui" font-size="10" letter-spacing="1.5" fill="#92859e">FOR</text><text x="81" y="424" class="ui" font-size="14" fill="#53495e">People celebrating small moments.</text>
  <text x="81" y="458" class="ui" font-size="10" letter-spacing="1.5" fill="#92859e">FEEL</text><text x="81" y="483" class="ui" font-size="14" fill="#53495e">Warm. Thoughtful. A little playful.</text>
  <circle cx="95" cy="526" r="12" fill="#754adb"/><circle cx="131" cy="526" r="12" fill="#eb947f"/><circle cx="167" cy="526" r="12" fill="#c1c9ad"/>
  <path d="M288 526C269 522 263 505 271 494C286 497 294 508 288 526Z" fill="#c1c9ad"/><path d="M290 537V502" stroke="#4a5b3e" stroke-width="2"/>
 </g>
 <path d="M376 243C410 243 409 208 448 208" stroke="#754adb" stroke-width="2" marker-end="url(#arrow)"/>
 <g class="ui">
  <text x="440" y="171" font-size="10" letter-spacing="1.8" font-weight="700" fill="#92859e">DESIGN DECISIONS</text>
  <circle cx="451" cy="235" r="14" fill="#754adb"/><text x="451" y="239" font-size="10" font-weight="700" fill="white" text-anchor="middle">01</text><text x="478" y="232" font-size="15" font-weight="700" fill="#292432">Audience first</text><text x="478" y="254" font-size="12" fill="#82758e">Who is this for?</text>
  <path d="M451 260V296" stroke="#c6b3e5" stroke-width="1.5" class="flow"/>
  <circle cx="451" cy="319" r="14" fill="#754adb"/><text x="451" y="323" font-size="10" font-weight="700" fill="white" text-anchor="middle">02</text><text x="478" y="316" font-size="15" font-weight="700" fill="#292432">One clear message</text><text x="478" y="338" font-size="12" fill="#82758e">What should they remember?</text>
  <path d="M451 344V380" stroke="#c6b3e5" stroke-width="1.5" class="flow"/>
  <circle cx="451" cy="403" r="14" fill="#754adb"/><text x="451" y="407" font-size="10" font-weight="700" fill="white" text-anchor="middle">03</text><text x="478" y="400" font-size="15" font-weight="700" fill="#292432">Intentional hierarchy</text><text x="478" y="422" font-size="12" fill="#82758e">Make the next step obvious.</text>
  <path d="M451 428V464" stroke="#c6b3e5" stroke-width="1.5" class="flow"/>
  <circle cx="451" cy="487" r="14" fill="#754adb"/><text x="451" y="491" font-size="10" font-weight="700" fill="white" text-anchor="middle">04</text><text x="478" y="484" font-size="15" font-weight="700" fill="#292432">Color with purpose</text><text x="478" y="506" font-size="12" fill="#82758e">Set the right emotional tone.</text>
 </g>
 <path d="M620 549C670 549 651 583 706 583" stroke="#754adb" stroke-width="2" marker-end="url(#arrow)"/>
 <g transform="rotate(5 884 365)" filter="url(#shadow)">
  <rect x="727" y="141" width="310" height="451" rx="3" fill="#eb947f"/><text x="753" y="177" class="ui" font-size="10" letter-spacing="2.4" fill="#5a344a">PETAL STUDIO</text><path d="M753 192H1010" stroke="#b96e68"/>
  <text x="753" y="246" class="serif" font-size="45" letter-spacing="-1.5" fill="#292432">Flowers for</text><text x="753" y="294" class="serif" font-size="45" letter-spacing="-1.5" fill="#292432">the everyday.</text>
  <path d="M885 498V401" stroke="#4a5b3e" stroke-width="6"/><path d="M884 468C843 469 817 446 827 423C856 418 881 436 884 468Z" fill="#647555"/><path d="M887 447C883 417 906 396 932 402C936 426 917 447 887 447Z" fill="#879775"/>
