  <path d="M753 526H1010" stroke="#b96e68"/><text x="753" y="552" class="ui" font-size="10" letter-spacing=".8" fill="#5a344a">A SMALL GESTURE. A LOVELY FEELING.</text><text x="753" y="572" class="ui" font-size="9" fill="#5a344a">Example brand direction</text>
 </g>
 <path d="M81 643H1040" stroke="#d8cedd"/><text x="81" y="673" class="serif" font-size="22" fill="#6f607c">Good design begins before the first shape.</text>
